services:
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    env_file:
      - .env
    dns:
      - 192.168.1.20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./appdata:/appdata
    ports:
      - "7575:7575"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
