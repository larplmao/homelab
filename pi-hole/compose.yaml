services:
  pihole:
    container_name: pihole
    hostname: pihole
    image: pihole/pihole:2026.07.2
    ports:
      # DNS
      - "53:53/tcp"
      - "53:53/udp"
      # HTTP
      - "80:80/tcp"
      # DHCP
      # - "67:67/udp"
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: "ALL"
    volumes:
      - ./data:/etc/pihole
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - dns
networks:
  dns:
    driver: bridge
